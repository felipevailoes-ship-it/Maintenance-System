<!-- Estrutura do Modal, um dialog será para a criação de uma nova O.S e edição, outro dialog será para um modal de exclusão da O.S -->

<dialog id="workOrderModal">

        <h2 id="modalTitle">Cadastro de Ordem de Serviço</h2>

        <form id="workOrderForm">
            <label for="subject">Assunto</label>
            <select id="subject">
                <option>Assunto teste mock</option>
            </select>

            <label for="equipments">Equipamento</label>
            <select id="equipments" name="equipments">
                <option>Equipamento teste mock</option>
            </select>
            
            <label for="status">Status</label>
            <select id="status" name="status">
                <option value="open">Aberta</option>
                <option value="in_progress">Em andamento</option>
                <option value="completed">Concluída</option>
            </select>

            <label for="priority">Prioridade</label>
            <select id="priority" name="priority">
                <option value="low">Baixa</option>
                <option value="medium">Média</option>
                <option value="high">Alta</option>
                <option value="criticism">Crítica</option>
            </select>
            
            <label for="dateHour">Data/Hora</label>
            <input type="datetime-local"
                    id="dateHour"
                    name="dateHour">

            <button
                id="btnSubmit"
                type="submit">
                Criar
            </button>
            <button 
                id="btnCancel"
                type="button">
                Cancelar
            </button>

        </form>
</dialog>

<dialog id="deleteWorkOrderModal">

    <h2>Excluir ordem de serviço</h2>

    <p id="deleteMessage">Tem certeza que deseja excluir esta ordem de serviço?
    </p>

    <button id="btnCancelDelete" type="button">Cancelar</button>
    <button id="btnConfirmDelete" type="button">Excluir</button>

</dialog>
