<!-- Estrutura do Modal, um dialog será para a criação de uma nova O.S e edição, outro dialog será para um modal de exclusão da O.S -->

<dialog id="workOrderModal" class="card p-4 shadow col-12 col-md-10 col-lg-8">

    <h2 id="modalTitle">Cadastro de Ordem de Serviço</h2>

    <form id="workOrderForm">

        <div class="mb-3">
            <label for="equipments" class="form-label">Equipamento</label>
            <select id="equipments" name="equipments" class="form-select" required></select>
        </div>

        <div class="mb-3">
            <label for="technicians" class="form-label">Técnicos</label>
            <select id="technicians" name="technicians" class="form-select" required></select>
        </div>

        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select id="status" name="status" class="form-select" required>
                <option value="open">Aberta</option>
                <option value="in_progress">Em andamento</option>
                <option value="completed">Concluída</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="priority" class="form-label">Prioridade</label>
            <select id="priority" name="priority" class="form-select" required>
                <option value="low">Baixa</option>
                <option value="medium">Média</option>
                <option value="high">Alta</option>
                <option value="criticism">Crítica</option>
            </select>
        </div>

        <div class="d-flex justify-content-end gap-2">
            <button id="btnSubmit" type="submit" class="btn btn-primary">
                Criar
            </button>

            <button id="btnCancel" type="button" class="btn btn-secondary">
                Cancelar
            </button>
        </div>

    </form>
</dialog>

<dialog id="deleteWorkOrderModal" class="card p4 shadow col-12 col-md-8 col-lg-6">
    <h2>Excluir ordem de serviço</h2>
    <p id="deleteMessage">Tem certeza que deseja excluir esta ordem de serviço?</p>

    <div class="d flex justify-content-end gap-2">
        <button id="btnCancelDelete" type="button" class="btn btn-secondary">Cancelar</button>
        <button id="btnConfirmDelete" type="button" class="btn btn-danger">Excluir</button>
    </div>

</dialog>
