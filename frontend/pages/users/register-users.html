<dialog id="usersModal">

    <h2 id="modalTitle"></h2>Cadastro de Usuário</h2>

    <form id="usersForm">
        <label for="name">Nome</label>
        <select id="name">
            <option>Nome teste mock</option>
        </select>

        <label for="email">E-mail</label>
        <select id="email">
            <option>E-mail teste mock</option>
        </select>

         <label for="password">Senha</label>
        <select id="email">
            <option>Senha teste mock</option>
        </select>

        <label for="status">Status</label>
        <select id="email">
            <option>Status teste mock</option>
        </select>
        
        <label for="dateHour">Data/Hora</label>
        <input type="datetime-local" name="dateHour"
                id="dateHour"
                name="dateHour">

        <button
            id="btnSubmit"
            type="submit">
            Criar
        </button>
        <button 
            id="btnCancel"
            type="button">
            Cancelar
        </button>

    </form>
</dialog>

<dialog id="deleteUsersModal">

    <h2>Excluir usuário</h2>

        <p id="deleteMessage">Tem certeza que deseja excluir este usuário?
        </p>

    <button id="btnCancelDelete" type="button">Cancelar</button>
    <button id="btnConfirmDelete" type="button">Excluir</button>

</dialog>
