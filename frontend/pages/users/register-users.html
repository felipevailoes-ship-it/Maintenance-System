<dialog id="usersModal">

    <h2 id="modalTitle">Cadastro de Usuário</h2>

    <form id="usersForm">
        <label for="name">Nome</label>
        <input type="text" id="name" name="name" required>

        <label for="email">E-mail</label>
         <input type="email" id="email" name="email" required>

         <label for="password">Senha</label>
         <input type="password" id="password" name="password" required>

        <label for="status">Status</label>
        <select id="status">
            <option value="active">Ativo</option>
            <option value="inactive">Inativo</option>
        </select>

        <button
            id="btnSubmit"
            type="submit">
            Criar
        </button>
        <button 
            id="btnCancel"
            type="button">
            Cancelar
        </button>

    </form>
</dialog>

<dialog id="deleteUsersModal">

    <h2>Excluir usuário</h2>

        <p id="deleteMessage">Tem certeza que deseja excluir este usuário?
        </p>

    <button id="btnCancelDelete" type="button">Cancelar</button>
    <button id="btnConfirmDelete" type="button">Excluir</button>

</dialog>
