<dialog id="usersModal" class="card p-4 shadow col-12 col-md-10 col-lg-8">

    <h2 id="modalTitle">Cadastro de Usuário</h2>

    <form id="usersForm">

        <div class="mb-3">
            <label for="name" class="form-label">Nome</label>
            <input type="text" id="name" name="name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Senha</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select id="status" name="status" class="form-select" required>
                <option value="active">Ativo</option>
                <option value="inactive">Inativo</option>
            </select>
        </div>

        <div class="d-flex justify-content-end gap-2">
            <button id="btnSubmit" type="submit" class="btn btn-primary">
                Criar
            </button>

            <button id="btnCancel" type="button" class="btn btn-secondary">
                Cancelar
            </button>
        </div>

    </form>
</dialog>

<dialog id="deleteUsersModal" class="card p-4 shadow col-12 col-md-8 col-lg-6">
    <h2>Excluir usuário</h2>
    <p id="deleteMessage">Tem certeza que deseja excluir este usuário?</p>

    <div class="d flex justify-content-end gap-2">
        <button id="btnCancelDelete" type="button" class="btn btn-secondary">Cancelar</button>
        <button id="btnConfirmDelete" type="button" class="btn btn-danger">Excluir</button>
    </div>

</dialog>
