<dialog id="subjectsModal">

    <h2 id="modalTitle">Cadastro de Assuntos</h2>

    <form id="subjectsForm">
        <label for="name">Nome do assunto</label>
        <input type="text" id="name" name="name" required>

        <label for="description">Descrição</label>
        <input type="text" id="description" name="description" required>
        
        <label for="dateHour">Data/Hora</label>
        <input type="datetime-local" id="dateHour" name="dateHour">

        <button
            id="btnSubmit"
            type="submit">
            Criar
        </button>
        <button 
            id="btnCancel"
            type="button">
            Cancelar
        </button>

    </form>
</dialog>

<dialog id="deleteSubjectsModal">

    <h2>Excluir assunto</h2>

        <p id="deleteMessage">Tem certeza que deseja excluir este assunto?
        </p>

    <button id="btnCancelDelete" type="button">Cancelar</button>
    <button id="btnConfirmDelete" type="button">Excluir</button>

</dialog>
