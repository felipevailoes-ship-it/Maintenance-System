<dialog id="equipmentsModal"
            class="card p4 shadow col-12 col-md-10 col-lg-8">

        <h2 id="modalTitle">Cadastro de Equipamento</h2>

        <form id="equipmentsForm">

            <div class="mb-3">
            <label for="name" class="form-label">Nome do equipamento</label>
            <input type="text" id="name" name="name" class="form-control" required>
            </div>

            <div class="mb-3">
            <label for="categories" class="form-label">Categorias</label>
            <select id="categories" name="categories" class="form-select"></select>
            </div>

            <div class="mb-3">
            <label for="location" class="form-label">Local</label>
            <select id="location" name="location" class="form-select"></select>
            </div>


            <div class="mb-3">
            <label for="assetTag" class="form-label">Patrimônio</label>
            <input type="text" id="assetTag" name="name" class="form-control" required>
            </div>

            <div class="mb-3">
            <label for="status" class="form-label">Status</label>
                <select id="status" class="form-select">
                    <option value="active">Ativo</option>
                    <option value="inactive">Inativo</option>
                 </select>
            </div>

            <div class="d-flex justify-content-end gap-2">
            <button
                id="btnSubmit"
                type="submit"
                class="btn btn-primary">
                Criar
            </button>

            <button 
                id="btnCancel"
                type="button"
                class="btn btn-secondary">
                Cancelar
            </button>
            </div>

        </form>
</dialog>

<dialog id="deleteEquipmentModal"
        class="card p-4 shadow col-12 col-md-8 col-lg-6">
    <h2>Excluir equipamento</h2>
        <p id="deleteMessage">Tem certeza que deseja excluir este equipamento?</p>
    <div class="card p-4 shadow col-12 col-md-8 col-lg-6">
    <button id="btnCancelDelete" type="button" class="btn btn-secondary">Cancelar</button>
    <button id="btnConfirmDelete" type="button" class="btn btn-danger">Excluir</button>
    </div>

</dialog>
