<!-- Estrutura do Modal, um dialog será para a criação de um novo equipamento e edição, outro dialog será para um modal de exclusão do equipamento -->

<dialog id="equipmentsModal">

        <h2 id="modalTitle">Cadastro de Equipamento</h2>

        <form id="equipmentsForm">
            <label for="name">Nome do equipamento</label>
            <input type="text" id="name" name="name" required>

            <label for="categories">Categorias</label>
            <select id="categories" name="categories">
                <option>Categoria teste mock</option>
            </select>
            
            <label for="serialNumber">Número de série</label>
            <input type="text" id="serialNumber" name="serialNumber" required>

            <label for="description">Descrição</label>
            <input type="text" id="description" name="description" required>
            
            <label for="dateHour">Data/Hora</label>
            <input type="datetime-local" id="dateHour" name="dateHour">

            <button
                id="btnSubmit"
                type="submit">
                Criar
            </button>
            <button 
                id="btnCancel"
                type="button">
                Cancelar
            </button>

        </form>
</dialog>

<dialog id="deleteEquipmentModal">

    <h2>Excluir equipamento</h2>

    <p id="deleteMessage">Tem certeza que deseja excluir este equipamento?
    </p>

    <button id="btnCancelDelete" type="button">Cancelar</button>
    <button id="btnConfirmDelete" type="button">Excluir</button>

</dialog>
