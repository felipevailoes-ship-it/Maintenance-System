<dialog id="techniciansModal">

        <h2 id="modalTitle">Cadastro de Técnicos</h2>

        <form id="techniciansForm">
            <label for="name">Nome completo</label>
            <input type="text" id="name" name="name" required>

            <label for="telephone">Telefone</label>
            <input type="text" id="telephone" name="name" required>

            <label for="email">E-mail</label>
            <input type="text" id="email" name="name" required>

            <button
                id="btnSubmit"
                type="submit">
                Criar
            </button>
            <button 
                id="btnCancel"
                type="button">
                Cancelar
            </button>

        </form>
</dialog>

<dialog id="deleteEquipmentModal">

    <h2>Excluir Técnico</h2>

    <p id="deleteMessage">Tem certeza que deseja excluir este técnico?
    </p>

    <button id="btnCancelDelete" type="button">Cancelar</button>
    <button id="btnConfirmDelete" type="button">Excluir</button>

</dialog>
