<dialog id="techniciansModal" class="card p-4 shadow col-12 col-md-10 col-lg-8">

    <h2 id="modalTitle">Cadastro de Técnicos</h2>

    <form id="techniciansForm">

        <div class="mb-3">
            <label for="name" class="form-label">Nome completo</label>
            <input type="text" id="name" name="name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="telephone" class="form-label">Telefone</label>
            <input type="text" id="telephone" name="name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="text" id="email" name="name" class="form-control" required>
        </div>

        <div class="d-flex justify-content-end gap-2">
            <button id="btnSubmit" type="submit" class="btn btn-primary">
                Criar
            </button>

            <button id="btnCancel" type="button" class="btn btn-secondary">
                Cancelar
            </button>
        </div>

    </form>
</dialog>

<dialog id="deleteEquipmentModal" class="card p-4 shadow col-12 col-md-8 col-lg-6">
    <h2>Excluir Técnico</h2>
    <p id="deleteMessage">Tem certeza que deseja excluir este técnico?</p>

    <div class="d-flex justify-content-end gap-2">
        <button id="btnCancelDelete" type="button" class="btn btn-secondary">Cancelar</button>
        <button id="btnConfirmDelete" type="button" class="btn btn-danger">Excluir</button>
    </div>

</dialog>
